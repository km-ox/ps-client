name: Python package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.27"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest -v

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.27"
          enable-cache: true

      - name: Install dependencies (prod only)
        run: uv sync --locked

      - name: Validate version matches tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"   # e.g. v0.6.0

          # Extract version from pyproject.toml using Python's tomllib
          PROJECT_VERSION=$(python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          EOF
          )

          if [[ "v${PROJECT_VERSION}" != "${TAG}" ]]; then
            echo "❌ Tag ${TAG} does not match project version v${PROJECT_VERSION}"
            exit 1
          fi

          echo "✅ Tag matches project version: ${TAG}"

      - name: Build wheel & sdist using uv
        run: uv build

      - name: Create or update GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          make_latest: true      # THIS auto-creates the release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
