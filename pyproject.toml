[project]
name = "ps-client"
version = "0.9.0"
description = "client to read configuration from AWS Parameter Store, and AWS Secrets Manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.36",
]
authors = [
    { name = "Krishnan M", email = "krishnan.mani@ashmus.ox.ac.uk" }
]
keywords = ["AWS", "parameter-store", "secrets-manager", "config", "secrets", "environments"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "boto3-stubs>=1.42.61",
    "moto[ssm]>=5.1.20",
    "pytest>=9.0.2",
    "pytest-random-order>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ps_client*"]

[tool.pytest.ini_options]
pythonpath = "src/"
addopts = [
    "--import-mode=importlib",
    "--random-order",
]
markers = [
    "integration: marks tests that rely on an environment",
]
